name: CI/CD Deploy

on:
  push:
    branches:
      - main   # déclenche le workflow à chaque push sur main

concurrency:
  group: deploy-local
  cancel-in-progress: true   # annule un déploiement en cours si un nouveau push arrive

jobs:
  deploy:
    runs-on: self-hosted   # ⚠️ utilise ton runner local (VM Debian)

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Installer les dépendances globales (workspaces client + server)
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build frontend (React/Vite)
      - name: Build frontend
        run: npm run build


      # 6️⃣ Déployer avec Ansible (sur la même VM)
      - name: Deploy with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e "repo_src=${{ github.workspace }}"
