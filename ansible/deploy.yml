---
- name: Déploiement monorepo DevOps
  hosts: prod
  become: yes

  vars:
    app_dir: /var/www/devops

  tasks:

    # ========================
    # INSTALLATION NODE 20+
    # ========================
    - name: Vérifier la version de Node.js
      command: node -v
      register: node_version
      ignore_errors: yes

    - name: Installer Node.js 20 si version trop vieille
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
      when: node_version.stdout is not defined or node_version.stdout is version('20', '<')

    - name: Vérifier Node.js après installation
      command: node -v

    # ========================
    # CLEAN
    # ========================
    - name: Supprimer l'ancien projet
      file:
        path: "{{ app_dir }}"
        state: absent

    - name: Créer le dossier projet
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    # ========================
    # SYNCHRONISATION
    # ========================
    - name: Synchroniser le repo
      synchronize:
        src: "{{ repo_src | default(github_workspace) }}/"
        dest: "{{ app_dir }}/"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=.github"

    # ========================
    # FRONTEND
    # ========================
    - name: Installer dépendances frontend
      command: npm install
      args:
        chdir: "{{ app_dir }}/client"

    - name: Installer react-chartjs-2 et chart.js si manquant
      command: npm install react-chartjs-2 chart.js
      args:
        chdir: "{{ app_dir }}/client"

    - name: Build frontend
      command: npm run build
      args:
        chdir: "{{ app_dir }}/client"

    # ========================
    # BACKEND
    # ========================
    - name: Installer dépendances backend
      command: npm install
      args:
        chdir: "{{ app_dir }}/server"

    - name: Installer PM2 globalement
      npm:
        name: pm2
        global: yes

    - name: Démarrer ou redémarrer l'API avec PM2
      command: pm2 startOrReload ecosystem.config.js
      args:
        chdir: "{{ app_dir }}/server"
